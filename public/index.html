<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PitchTank</title>
    <meta name="theme-color" content="#2E4A3E" />
    <link rel="icon" href="./logo.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E6;
        color: #231F20;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .logo {
        width: 96px;
        height: 96px;
        margin-bottom: 16px;
        border-radius: 16px;
        box-shadow: 4px 4px 0px #231F20;
      }
      .title {
        font-size: 24px;
        font-weight: 900;
        margin: 0;
        letter-spacing: 2px;
      }
      .loader {
        width: 32px;
        height: 32px;
        border: 4px solid #2E4A3E;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 24px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <img src="./logo.png" alt="PitchTank" class="logo" />
    <h1 class="title">PITCHTANK</h1>
    <p style="font-size: 13px; color: #57534E; margin-top: 6px;">Entering the Tank...</p>
    <div class="loader"></div>
    <script>
      // When deployed, this redirects to your live hosted PitchTank web application
      // Or local shell
      setTimeout(() => {
        window.location.href = window.location.origin + "/";
      }, 500);
    </script>
  </body>
</html>
