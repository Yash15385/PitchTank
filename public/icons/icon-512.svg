<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#2E4A3E"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="#F5F0E6" stroke="#231F20" stroke-width="12"/>
  <!-- Paper texture dashed stitch -->
  <rect x="44" y="44" width="424" height="424" rx="64" fill="none" stroke="#2E4A3E" stroke-width="4" stroke-dasharray="12 8"/>
  
  <!-- Shark Body Geometric -->
  <g transform="translate(40, 20)">
    <!-- Dorsal Fin -->
    <path d="M 216 110 L 256 30 L 296 110 Z" fill="#2E4A3E" stroke="#231F20" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Main Body Silhouette -->
    <path d="M 60 270 Q 216 130 380 230 L 420 250 L 380 300 Q 216 350 60 270 Z" fill="#2E4A3E" stroke="#231F20" stroke-width="8"/>
    
    <!-- Cream Underbelly -->
    <path d="M 120 280 Q 230 340 370 290 L 380 300 Q 216 350 60 270 Q 90 275 120 280 Z" fill="#E8DCC4" stroke="#231F20" stroke-width="6"/>

    <!-- Sharp Teeth -->
    <polygon points="120,265 135,280 150,265 165,280 180,265 195,280 210,265" fill="#FAF7F0" stroke="#231F20" stroke-width="4"/>

    <!-- Eye (Geometric Monocle) -->
    <circle cx="150" cy="220" r="24" fill="#F59E0B" stroke="#231F20" stroke-width="8"/>
    <circle cx="150" cy="220" r="14" fill="#231F20"/>
    <circle cx="144" cy="214" r="5" fill="#FFFFFF"/>
    <!-- Monocle chain -->
    <path d="M 174 220 Q 210 260 240 250" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="6 4"/>

    <!-- Tail Fin -->
    <path d="M 400 240 L 460 160 L 430 250 L 460 340 Z" fill="#2E4A3E" stroke="#231F20" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Stamp Red Banner -->
    <g transform="rotate(-8 216 340)">
      <rect x="70" y="320" width="292" height="64" rx="8" fill="#D9534F" stroke="#231F20" stroke-width="6"/>
      <text x="216" y="365" font-family="Georgia, serif" font-weight="900" font-size="36" fill="#F5F0E6" text-anchor="middle" letter-spacing="4">PITCH TANK</text>
    </g>
  </g>
</svg>
